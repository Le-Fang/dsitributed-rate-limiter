name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.x', '1.27.x']
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go build ./...
        timeout-minutes: 3
      - run: go test -timeout 3m ./...
        timeout-minutes: 5
      - run: go test -race -timeout 3m ./...
        if: matrix.go == '1.27.x'
        timeout-minutes: 5
      - name: Bounded scheduler capacity smoke
        run: go test -race -run '^TestLoadCapacitySmoke$' -count=1 .
        if: matrix.go == '1.27.x'
        timeout-minutes: 2
      - run: go vet ./...
        timeout-minutes: 3

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: Install pinned scanner outside library module
        run: GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
        timeout-minutes: 5
      - name: Scan reachable vulnerabilities
        run: "$RUNNER_TEMP/bin/govulncheck" ./...
        timeout-minutes: 5

  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 20
    env:
      REQUIRE_REDIS: '1'
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_ISOLATED: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - run: go test -timeout 3m -run 'Test(Redis|Protocol|StateMachineFoundation|SchedulerConstructorRedis)' -count=1 .
        timeout-minutes: 5
